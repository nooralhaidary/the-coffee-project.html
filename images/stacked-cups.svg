<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 520" fill="none" stroke="#512b20" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- one cup: body + rim; handle drawn separately so it can flip -->
    <g id="cup-body">
      <path d="M-62 0 C -60 48, -40 72, 0 72 C 40 72, 60 48, 62 0 Z" fill="#f6e4b4" stroke-width="10"/>
      <path d="M-46 30 C -40 50, -22 58, -6 58" stroke="#e8c98a" stroke-width="6"/>
      <ellipse cx="0" cy="0" rx="62" ry="15" fill="#f6e4b4" stroke-width="10"/>
    </g>
    <g id="cup-handle">
      <path d="M54 14 C 96 6, 100 56, 44 52" stroke-width="24"/>
      <path d="M54 14 C 96 6, 100 56, 44 52" stroke="#f6e4b4" stroke-width="9"/>
    </g>
  </defs>

  <!-- motion marks -->
  <g stroke-width="9">
    <path d="M40 352 C 30 366, 34 380, 46 388"/>
    <path d="M22 344 C 8 364, 14 386, 30 396"/>
    <path d="M262 350 C 272 364, 268 378, 256 386"/>
    <path d="M280 342 C 294 362, 288 384, 272 394"/>
    <path d="M238 70 C 250 78, 252 92, 246 104"/>
    <path d="M256 60 C 272 72, 274 94, 264 110"/>
  </g>

  <!-- arm and fist holding the stick -->
  <path d="M128 430 L 118 512 L 178 512 L 172 430 Z" fill="#f6e4b4" stroke-width="10"/>
  <path d="M150 380 L 150 430" stroke-width="26"/>
  <path d="M150 380 L 150 430" stroke="#f6e4b4" stroke-width="10"/>
  <rect x="112" y="400" width="76" height="52" rx="22" fill="#f6e4b4" stroke-width="10"/>
  <path d="M122 418 L 150 418 M122 434 L 152 434" stroke-width="7"/>
  <path d="M176 406 C 196 410, 196 430, 182 440" stroke-width="9"/>

  <!-- tray -->
  <ellipse cx="150" cy="372" rx="104" ry="20" fill="#f6e4b4" stroke-width="10"/>
  <ellipse cx="150" cy="368" rx="70" ry="10" stroke-width="6"/>

  <!-- the stack, bottom to top -->
  <g transform="translate(150 292)">
    <use href="#cup-handle"/><use href="#cup-body"/>
  </g>
  <g transform="translate(142 236) rotate(-7)">
    <use href="#cup-handle"/><use href="#cup-body"/>
  </g>
  <g transform="translate(154 180) rotate(9)">
    <g transform="scale(-1 1)"><use href="#cup-handle"/></g><use href="#cup-body"/>
  </g>
  <g transform="translate(150 122) rotate(-11)">
    <use href="#cup-handle"/><use href="#cup-body"/>
    <!-- coffee in the top cup -->
    <ellipse cx="0" cy="0" rx="46" ry="8" fill="#512b20" stroke="none"/>
  </g>
</svg>
